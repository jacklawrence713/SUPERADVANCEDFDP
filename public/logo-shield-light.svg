<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
  <defs>
    <linearGradient id="sGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Light background -->
  <rect width="400" height="460" rx="16" fill="#f0edf6"/>

  <!-- Shield outline -->
  <path d="M200 42 C120 42 60 52 60 52 L60 220 C60 300 120 370 200 420 C280 370 340 300 340 220 L340 52 C340 52 280 42 200 42Z"
        fill="none" stroke="url(#sGradL)" stroke-width="4" stroke-linejoin="round" opacity="0.7"/>

  <!-- Football / eye shape -->
  <g transform="translate(200,148)">
    <ellipse cx="0" cy="0" rx="82" ry="48" fill="none" stroke="#8b7ab5" stroke-width="3" opacity="0.6"/>

    <!-- Bar chart laces -->
    <rect x="-20" y="-28" width="10" height="56" rx="2" fill="url(#bGradL)" opacity="0.8"/>
    <rect x="-5" y="-36" width="10" height="72" rx="2" fill="url(#bGradL)" opacity="0.8"/>
    <rect x="10" y="-22" width="10" height="44" rx="2" fill="url(#bGradL)" opacity="0.8"/>

    <!-- Horizontal lace lines -->
    <line x1="-50" y1="0" x2="-28" y2="0" stroke="#8b7ab5" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="28" y1="0" x2="50" y2="0" stroke="#8b7ab5" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- FANTASY text -->
  <text x="200" y="240" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="26" font-weight="700" letter-spacing="8" fill="#7c6aaa">FANTASY</text>

  <!-- DRAFTPROS text -->
  <text x="200" y="300" text-anchor="middle" font-family="'Inter','Segoe UI',system-ui,sans-serif" font-size="56" font-weight="900" letter-spacing="2" fill="url(#sGradL)">DRAFTPROS</text>

  <!-- Star -->
  <polygon points="200,340 205,352 218,352 208,360 212,373 200,365 188,373 192,360 182,352 195,352"
           fill="url(#sGradL)" opacity="0.7"/>
</svg>
