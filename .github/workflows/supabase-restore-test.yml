name: Supabase Final Migration Rehearsal (TESTING ONLY)

on:
  workflow_dispatch:
  push:
    branches:
      - fdp-value-consistency
    paths:
      - '.github/workflows/supabase-restore-test.yml'

permissions: {}

jobs:
  rehearsal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact remediation commit
        uses: actions/checkout@v4
        with:
          ref: 2adfbb954190a5066af27e8987dfcda1961b0e4b

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Create backup folder
        run: mkdir -p restore-test

      - name: Safety check - Verify separate connection strings
        env:
          PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          if [ "$PROD_DB_URL" = "$TEST_DB_URL" ]; then
            echo "ERROR: FATAL: SUPABASE_DB_URL and SUPABASE_TEST_DB_URL are identical"
            echo "This would destroy production data"
            exit 1
          fi
          echo "OK: Production and test databases are distinct"

      - name: Backup production roles (READ-ONLY)
        env:
          PGOPTIONS: "-c default_transaction_read_only=on"
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "=== BACKUP PRODUCTION ROLES (READ-ONLY) ==="
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f restore-test/roles.sql \
            --role-only
          echo "OK: Roles dumped: $(wc -l < restore-test/roles.sql) lines"

      - name: Backup production schema (READ-ONLY)
        env:
          PGOPTIONS: "-c default_transaction_read_only=on"
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "=== BACKUP PRODUCTION SCHEMA (READ-ONLY) ==="
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f restore-test/schema.sql
          echo "OK: Schema dumped: $(wc -l < restore-test/schema.sql) lines"

      - name: Backup production data (READ-ONLY)
        env:
          PGOPTIONS: "-c default_transaction_read_only=on"
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "=== BACKUP PRODUCTION DATA (READ-ONLY) ==="
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f restore-test/data.sql \
            --use-copy \
            --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"
          echo "OK: Data dumped: $(wc -l < restore-test/data.sql) lines"

      - name: Verify production baseline - public tables count
        env:
          PGOPTIONS: "-c default_transaction_read_only=on"
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "=== PRODUCTION BASELINE: PUBLIC TABLES ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_DB_URL" \
            --tuples-only \
            --command "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';" \
            > /tmp/prod_public_tables.txt
          echo "Count: $(cat /tmp/prod_public_tables.txt | xargs)"

      - name: Verify production baseline - auth.users count
        env:
          PGOPTIONS: "-c default_transaction_read_only=on"
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "=== PRODUCTION BASELINE: auth.users ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_DB_URL" \
            --tuples-only \
            --command "SELECT COUNT(*) FROM auth.users;" \
            > /tmp/prod_auth_users.txt
          echo "Count: $(cat /tmp/prod_auth_users.txt | xargs)"

      - name: Verify production baseline - public.users count
        env:
          PGOPTIONS: "-c default_transaction_read_only=on"
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "=== PRODUCTION BASELINE: public.users ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_DB_URL" \
            --tuples-only \
            --command "SELECT COUNT(*) FROM public.users;" \
            > /tmp/prod_public_users.txt
          echo "Count: $(cat /tmp/prod_public_users.txt | xargs)"

      - name: Restore into test Supabase project
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          echo "=== RESTORE TO TEST DATABASE ==="
          psql \
            --single-transaction \
            -X -v ON_ERROR_STOP=1 \
            -f restore-test/roles.sql \
            -f restore-test/schema.sql \
            -c 'SET session_replication_role = replica' \
            -f restore-test/data.sql \
            "$SUPABASE_TEST_DB_URL"
          echo "OK: Restore completed"

      - name: Recreate production auth trigger baseline in TEST ONLY
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          echo "=== RECREATING AUTH TRIGGER BASELINE IN TEST ONLY ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" <<'AUTHBASELINE'
          DROP TRIGGER IF EXISTS on_auth_user_created ON auth.users;
          CREATE TRIGGER on_auth_user_created
            AFTER INSERT ON auth.users
            FOR EACH ROW EXECUTE PROCEDURE public.handle_new_user();
          AUTHBASELINE
          echo "OK: auth trigger baseline recreated"

      - name: Verify test database restore - public tables
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          echo "=== TEST RESTORE VERIFICATION: PUBLIC TABLES ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" \
            --tuples-only \
            --command "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';" \
            > /tmp/test_public_tables.txt
          TEST_COUNT=$(cat /tmp/test_public_tables.txt | xargs)
          PROD_COUNT=$(cat /tmp/prod_public_tables.txt | xargs)
          echo "Test: $TEST_COUNT | Production: $PROD_COUNT"
          if [ "$TEST_COUNT" != "$PROD_COUNT" ]; then
            echo "ERROR: FAILED: Public table count mismatch"
            exit 1
          fi
          echo "OK: Public table counts match"

      - name: Verify test database restore - auth.users
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          echo "=== TEST RESTORE VERIFICATION: auth.users ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" \
            --tuples-only \
            --command "SELECT COUNT(*) FROM auth.users;" \
            > /tmp/test_auth_users.txt
          TEST_COUNT=$(cat /tmp/test_auth_users.txt | xargs)
          PROD_COUNT=$(cat /tmp/prod_auth_users.txt | xargs)
          echo "Test: $TEST_COUNT | Production: $PROD_COUNT"
          if [ "$TEST_COUNT" != "$PROD_COUNT" ]; then
            echo "ERROR: FAILED: auth.users count mismatch"
            exit 1
          fi
          echo "OK: auth.users counts match"

      - name: Verify test database restore - public.users
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          echo "=== TEST RESTORE VERIFICATION: public.users ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" \
            --tuples-only \
            --command "SELECT COUNT(*) FROM public.users;" \
            > /tmp/test_public_users.txt
          TEST_COUNT=$(cat /tmp/test_public_users.txt | xargs)
          PROD_COUNT=$(cat /tmp/prod_public_users.txt | xargs)
          echo "Test: $TEST_COUNT | Production: $PROD_COUNT"
          if [ "$TEST_COUNT" != "$PROD_COUNT" ]; then
            echo "ERROR: FAILED: public.users count mismatch"
            exit 1
          fi
          echo "OK: public.users counts match"

      - name: Apply Migration 003 - odds_cache.sql
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          echo "=== APPLYING MIGRATION 003 ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" < supabase/migrations/20260921144441_odds_cache.sql
          echo "OK: Migration 003 applied"

      - name: Verify Migration 003 - odds_cache table and structure
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          echo "=== VERIFYING MIGRATION 003 ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" << 'VERIFY003'
          DO $$
          DECLARE
            v_count INT;
          BEGIN
            -- Table exists
            IF NOT EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'odds_cache') THEN
              RAISE EXCEPTION 'FAILED: odds_cache table does not exist';
            END IF;

            -- Has all required columns (verify exact count)
            SELECT COUNT(DISTINCT column_name) INTO v_count FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'odds_cache' AND column_name IN ('id', 'response', 'fetched_at', 'refreshing_until');
            IF v_count != 4 THEN
              RAISE EXCEPTION 'FAILED: odds_cache missing required columns (found %)', v_count;
            END IF;

            -- RLS enabled
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE relname = 'odds_cache' AND relnamespace = 'public'::regnamespace) THEN
              RAISE EXCEPTION 'FAILED: RLS not enabled on odds_cache';
            END IF;

            -- claim_odds_refresh function exists with correct signature
            IF NOT EXISTS(SELECT 1 FROM pg_proc WHERE proname = 'claim_odds_refresh' AND pronamespace = 'public'::regnamespace) THEN
              RAISE EXCEPTION 'FAILED: claim_odds_refresh function does not exist';
            END IF;

            -- Function is SECURITY DEFINER
            IF NOT (SELECT prosecdef FROM pg_proc WHERE proname = 'claim_odds_refresh' AND pronamespace = 'public'::regnamespace) THEN
              RAISE EXCEPTION 'FAILED: claim_odds_refresh is not SECURITY DEFINER';
            END IF;

            -- Seed row exists
            IF NOT EXISTS(SELECT 1 FROM public.odds_cache WHERE id = 'nfl_current') THEN
              RAISE EXCEPTION 'FAILED: Seed row nfl_current does not exist in odds_cache';
            END IF;
          END $$;
          VERIFY003
          echo "OK: Migration 003 verified"

      - name: Apply Migration 004 - fdp_value_snapshots.sql
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          echo "=== APPLYING MIGRATION 004 ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" < supabase/migrations/20260922003719_fdp_value_snapshots.sql
          echo "OK: Migration 004 applied"

      - name: Verify Migration 004 - FDP Value Snapshots structure
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          echo "=== VERIFYING MIGRATION 004 ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" << 'VERIFY004'
          DO $$
          DECLARE
            v_count INT;
          BEGIN
            -- Both tables exist
            IF NOT EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'fdp_snapshot_batches') THEN
              RAISE EXCEPTION 'FAILED: fdp_snapshot_batches table does not exist';
            END IF;
            IF NOT EXISTS(SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'fdp_value_snapshots') THEN
              RAISE EXCEPTION 'FAILED: fdp_value_snapshots table does not exist';
            END IF;

            -- Batches table has all required columns
            SELECT COUNT(DISTINCT column_name) INTO v_count FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'fdp_snapshot_batches' AND column_name IN ('id', 'values_version', 'effective_at', 'league_type', 'scoring', 'status');
            IF v_count != 6 THEN
              RAISE EXCEPTION 'FAILED: fdp_snapshot_batches missing required columns (found %)', v_count;
            END IF;

            -- Snapshots table has all required columns
            SELECT COUNT(DISTINCT column_name) INTO v_count FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'fdp_value_snapshots' AND column_name IN ('id', 'batch_id', 'player_slug', 'value', 'league_type', 'scoring');
            IF v_count != 6 THEN
              RAISE EXCEPTION 'FAILED: fdp_value_snapshots missing required columns (found %)', v_count;
            END IF;

            -- Unique index on batches
            IF NOT EXISTS(SELECT 1 FROM pg_indexes WHERE schemaname = 'public' AND tablename = 'fdp_snapshot_batches' AND indexname = 'uq_fdp_batch_version_context' AND indexdef ILIKE 'CREATE UNIQUE INDEX%') THEN
              RAISE EXCEPTION 'FAILED: uq_fdp_batch_version_context unique index missing';
            END IF;

            -- Unique index on snapshots
            IF NOT EXISTS(SELECT 1 FROM pg_indexes WHERE schemaname = 'public' AND tablename = 'fdp_value_snapshots' AND indexname = 'uq_fdp_snapshot_player_batch' AND indexdef ILIKE 'CREATE UNIQUE INDEX%') THEN
              RAISE EXCEPTION 'FAILED: uq_fdp_snapshot_player_batch unique index missing';
            END IF;

            -- RLS enabled on both
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE relname = 'fdp_snapshot_batches' AND relnamespace = 'public'::regnamespace) THEN
              RAISE EXCEPTION 'FAILED: RLS not enabled on fdp_snapshot_batches';
            END IF;
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE relname = 'fdp_value_snapshots' AND relnamespace = 'public'::regnamespace) THEN
              RAISE EXCEPTION 'FAILED: RLS not enabled on fdp_value_snapshots';
            END IF;

            -- Foreign key relationship
            IF NOT EXISTS(SELECT 1 FROM information_schema.table_constraints WHERE table_name = 'fdp_value_snapshots' AND constraint_type = 'FOREIGN KEY' AND constraint_name LIKE '%batch_id%') THEN
              RAISE EXCEPTION 'FAILED: Foreign key on fdp_value_snapshots.batch_id missing';
            END IF;
          END $$;
          VERIFY004
          echo "OK: Migration 004 verified"

      - name: Apply Migration 005 - entitlement_security.sql
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          echo "=== APPLYING MIGRATION 005 ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" < supabase/migrations/20260924152532_entitlement_security.sql
          echo "OK: Migration 005 applied"

      - name: Verify Migration 005 - Privilege Model (Metadata Assertions)
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          echo "=== VERIFYING MIGRATION 005: PRIVILEGE MODEL (METADATA) ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" << 'PRIVMETA005'
          DO $$
          DECLARE v_count INT; v_cols TEXT;
          BEGIN
            -- PUBLIC: zero table privileges
            SELECT COUNT(*) INTO v_count FROM information_schema.role_table_grants
            WHERE table_name = 'users' AND table_schema = 'public' AND grantee = 'PUBLIC';
            IF v_count != 0 THEN
              RAISE EXCEPTION 'FAILED: PUBLIC has % table privileges (expected 0)', v_count;
            END IF;

            -- anon: zero table privileges
            SELECT COUNT(*) INTO v_count FROM information_schema.role_table_grants
            WHERE table_name = 'users' AND table_schema = 'public' AND grantee = 'anon';
            IF v_count != 0 THEN
              RAISE EXCEPTION 'FAILED: anon has % table privileges (expected 0)', v_count;
            END IF;

            -- PUBLIC: zero column privileges
            SELECT COUNT(*) INTO v_count FROM information_schema.role_column_grants
            WHERE table_name = 'users' AND table_schema = 'public' AND grantee = 'PUBLIC';
            IF v_count != 0 THEN
              RAISE EXCEPTION 'FAILED: PUBLIC has % column privileges (expected 0)', v_count;
            END IF;

            -- anon: zero column privileges
            SELECT COUNT(*) INTO v_count FROM information_schema.role_column_grants
            WHERE table_name = 'users' AND table_schema = 'public' AND grantee = 'anon';
            IF v_count != 0 THEN
              RAISE EXCEPTION 'FAILED: anon has % column privileges (expected 0)', v_count;
            END IF;

            -- authenticated: SELECT exists
            SELECT COUNT(*) INTO v_count FROM information_schema.role_table_grants
            WHERE table_name = 'users' AND table_schema = 'public' AND grantee = 'authenticated' AND privilege_type = 'SELECT';
            IF v_count != 1 THEN
              RAISE EXCEPTION 'FAILED: authenticated SELECT not granted';
            END IF;

            -- authenticated: no table-level UPDATE
            SELECT COUNT(*) INTO v_count FROM information_schema.role_table_grants
            WHERE table_name = 'users' AND table_schema = 'public' AND grantee = 'authenticated' AND privilege_type = 'UPDATE';
            IF v_count != 0 THEN
              RAISE EXCEPTION 'FAILED: authenticated has table-level UPDATE (expected 0)';
            END IF;

            -- authenticated: UPDATE only on signup_ip and signup_visitor_id
            SELECT STRING_AGG(column_name, ',' ORDER BY column_name) INTO v_cols
            FROM information_schema.role_column_grants
            WHERE table_name = 'users' AND table_schema = 'public' AND grantee = 'authenticated' AND privilege_type = 'UPDATE';
            IF v_cols != 'signup_ip,signup_visitor_id' THEN
              RAISE EXCEPTION 'FAILED: authenticated UPDATE columns are %, expected signup_ip,signup_visitor_id', COALESCE(v_cols, 'NULL');
            END IF;

            -- authenticated: no INSERT
            SELECT COUNT(*) INTO v_count FROM information_schema.role_table_grants
            WHERE table_name = 'users' AND table_schema = 'public' AND grantee = 'authenticated' AND privilege_type = 'INSERT';
            IF v_count != 0 THEN
              RAISE EXCEPTION 'FAILED: authenticated has INSERT (expected 0)';
            END IF;

            -- authenticated: no DELETE
            SELECT COUNT(*) INTO v_count FROM information_schema.role_table_grants
            WHERE table_name = 'users' AND table_schema = 'public' AND grantee = 'authenticated' AND privilege_type = 'DELETE';
            IF v_count != 0 THEN
              RAISE EXCEPTION 'FAILED: authenticated has DELETE (expected 0)';
            END IF;

            -- authenticated: no TRUNCATE, REFERENCES, TRIGGER
            SELECT COUNT(*) INTO v_count FROM information_schema.role_table_grants
            WHERE table_name = 'users' AND table_schema = 'public' AND grantee = 'authenticated' AND privilege_type IN ('TRUNCATE', 'REFERENCES', 'TRIGGER');
            IF v_count != 0 THEN
              RAISE EXCEPTION 'FAILED: authenticated has TRUNCATE/REFERENCES/TRIGGER (expected 0)';
            END IF;

            -- service_role: SELECT, INSERT, UPDATE, DELETE
            SELECT COUNT(*) INTO v_count FROM information_schema.role_table_grants
            WHERE table_name = 'users' AND table_schema = 'public' AND grantee = 'service_role' AND privilege_type IN ('SELECT', 'INSERT', 'UPDATE', 'DELETE');
            IF v_count != 4 THEN
              RAISE EXCEPTION 'FAILED: service_role missing privileges (has %, expected 4)', v_count;
            END IF;

            -- on_auth_user_created trigger exists
            IF NOT EXISTS(SELECT 1 FROM information_schema.triggers WHERE trigger_name = 'on_auth_user_created' AND event_object_schema = 'auth' AND event_object_table = 'users') THEN
              RAISE EXCEPTION 'FAILED: on_auth_user_created trigger does not exist';
            END IF;

            -- Trigger invokes handle_new_user function
            IF NOT EXISTS(SELECT 1 FROM pg_trigger t JOIN pg_proc p ON t.tgfoid = p.oid WHERE t.tgname = 'on_auth_user_created' AND p.proname = 'handle_new_user') THEN
              RAISE EXCEPTION 'FAILED: on_auth_user_created trigger does not invoke handle_new_user';
            END IF;

            -- handle_new_user is SECURITY DEFINER
            SELECT COUNT(*) INTO v_count FROM pg_proc WHERE proname = 'handle_new_user' AND prosecdef = true AND pronamespace = 'public'::regnamespace;
            IF v_count != 1 THEN
              RAISE EXCEPTION 'FAILED: handle_new_user is not SECURITY DEFINER';
            END IF;
          END $$;
          PRIVMETA005
          echo "OK: Migration 005 privilege model metadata verified"

      - name: Verify Migration 005 - Authenticated behavior
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          echo "=== VERIFYING MIGRATION 005: AUTHENTICATED BEHAVIOR ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" << 'BEHAV005'
          DO $$
          DECLARE
            v_test_user_id UUID;
            v_count INT;
            v_jwt_sub TEXT;
            v_auth_update_count INT;
            v_verified_value TEXT;
          BEGIN
            -- Get an arbitrary test user from restored data
            SELECT id INTO v_test_user_id FROM public.users LIMIT 1;
            IF v_test_user_id IS NULL THEN
              RAISE EXCEPTION 'No test users available in restored database';
            END IF;

            -- Test 1: Authenticated can SELECT own row (with proper JWT context)
            SET ROLE authenticated;
            PERFORM set_config('request.jwt.claim.sub', v_test_user_id::text, false);
            SELECT auth.uid() INTO v_jwt_sub;
            IF v_jwt_sub::uuid != v_test_user_id THEN
              RAISE EXCEPTION 'FAILED: auth.uid() = % does not match test user %', v_jwt_sub, v_test_user_id;
            END IF;
            BEGIN
              SELECT COUNT(*) INTO v_count FROM public.users WHERE id = v_test_user_id;
              IF v_count != 1 THEN
                RAISE EXCEPTION 'FAILED: authenticated cannot SELECT own row';
              END IF;
            EXCEPTION
              WHEN insufficient_privilege THEN
                RAISE EXCEPTION 'FAILED: authenticated SELECT blocked by privilege';
              WHEN OTHERS THEN
                RAISE EXCEPTION 'FAILED: authenticated SELECT failed: %', SQLERRM;
            END;
            RESET ROLE;

            -- Test 2: Authenticated can UPDATE signup_ip and exactly one row persists
            SET ROLE authenticated;
            PERFORM set_config('request.jwt.claim.sub', v_test_user_id::text, false);
            BEGIN
              UPDATE public.users SET signup_ip = '192.0.2.1' WHERE id = v_test_user_id;
              GET DIAGNOSTICS v_auth_update_count = ROW_COUNT;
              IF v_auth_update_count != 1 THEN
                RAISE EXCEPTION 'FAILED: authenticated signup_ip UPDATE affected % rows, expected 1', v_auth_update_count;
              END IF;
              SELECT signup_ip::text INTO v_verified_value FROM public.users WHERE id = v_test_user_id;
              IF v_verified_value IS DISTINCT FROM '192.0.2.1' THEN
                RAISE EXCEPTION 'FAILED: signup_ip did not persist expected value, got %', COALESCE(v_verified_value, 'NULL');
              END IF;
            EXCEPTION
              WHEN OTHERS THEN
                RAISE EXCEPTION 'FAILED: authenticated cannot UPDATE/verify signup_ip: %', SQLERRM;
            END;
            RESET ROLE;

            -- Test 3: Authenticated can UPDATE signup_visitor_id and exactly one row persists
            SET ROLE authenticated;
            PERFORM set_config('request.jwt.claim.sub', v_test_user_id::text, false);
            BEGIN
              UPDATE public.users SET signup_visitor_id = 'visitor-123' WHERE id = v_test_user_id;
              GET DIAGNOSTICS v_auth_update_count = ROW_COUNT;
              IF v_auth_update_count != 1 THEN
                RAISE EXCEPTION 'FAILED: authenticated signup_visitor_id UPDATE affected % rows, expected 1', v_auth_update_count;
              END IF;
              SELECT signup_visitor_id::text INTO v_verified_value FROM public.users WHERE id = v_test_user_id;
              IF v_verified_value IS DISTINCT FROM 'visitor-123' THEN
                RAISE EXCEPTION 'FAILED: signup_visitor_id did not persist expected value, got %', COALESCE(v_verified_value, 'NULL');
              END IF;
            EXCEPTION
              WHEN OTHERS THEN
                RAISE EXCEPTION 'FAILED: authenticated cannot UPDATE/verify signup_visitor_id: %', SQLERRM;
            END;
            RESET ROLE;

            -- Test 4: Authenticated cannot UPDATE plan
            SET ROLE authenticated;
            PERFORM set_config('request.jwt.claim.sub', v_test_user_id::text, false);
            BEGIN
              UPDATE public.users SET plan = 'pro' WHERE id = v_test_user_id;
              RAISE EXCEPTION 'FAILED: authenticated was able to UPDATE plan';
            EXCEPTION
              WHEN insufficient_privilege THEN
                NULL;
              WHEN OTHERS THEN
                RAISE EXCEPTION 'FAILED: plan UPDATE error: %', SQLERRM;
            END;
            RESET ROLE;

            -- Test 5: Authenticated cannot UPDATE is_pro
            SET ROLE authenticated;
            PERFORM set_config('request.jwt.claim.sub', v_test_user_id::text, false);
            BEGIN
              UPDATE public.users SET is_pro = true WHERE id = v_test_user_id;
              RAISE EXCEPTION 'FAILED: authenticated was able to UPDATE is_pro';
            EXCEPTION
              WHEN insufficient_privilege THEN
                NULL;
              WHEN OTHERS THEN
                RAISE EXCEPTION 'FAILED: is_pro UPDATE error: %', SQLERRM;
            END;
            RESET ROLE;

            -- Test 6: Authenticated cannot UPDATE is_admin
            SET ROLE authenticated;
            PERFORM set_config('request.jwt.claim.sub', v_test_user_id::text, false);
            BEGIN
              UPDATE public.users SET is_admin = true WHERE id = v_test_user_id;
              RAISE EXCEPTION 'FAILED: authenticated was able to UPDATE is_admin';
            EXCEPTION
              WHEN insufficient_privilege THEN
                NULL;
              WHEN OTHERS THEN
