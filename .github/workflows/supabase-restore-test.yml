      - name: Verify Migration 006 - Behavioral tests A-H
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          echo "=== VERIFYING MIGRATION 006: BEHAVIORAL TESTS A-H ==="
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" << 'BEHAVIOR006'
          DO $$
          DECLARE
            v_user_ids UUID[];
            v_user_id UUID;
            v_result RECORD;
            v_request_id UUID;
            v_failed_request_id UUID;
            v_req_id_c3_stored UUID;
            v_succeeded_count INT;
            v_reserved_count INT;
            v_count INT;
            i INT;
          BEGIN
            SELECT ARRAY(SELECT DISTINCT id FROM public.users ORDER BY id LIMIT 12) INTO v_user_ids;
            IF array_length(v_user_ids, 1) < 8 THEN
              RAISE EXCEPTION 'FAILED: Need 8+ restored users for isolated quota tests';
            END IF;

            -- TEST A: Failed analysis releases quota completely
            v_user_id := v_user_ids[1];
            UPDATE public.users SET plan = 'free', is_pro = false WHERE id = v_user_id;

            v_failed_request_id := gen_random_uuid();
            SELECT * INTO v_result
            FROM public.reserve_trade_quota(v_user_id, v_failed_request_id, 'test-a-fp-failed');
            IF NOT v_result.success THEN
              RAISE EXCEPTION 'FAILED A1: initial reserve failed: %', v_result.error_message;
            END IF;

            SELECT * INTO v_result
            FROM public.finalize_trade_quota(v_user_id, v_failed_request_id, false, NULL);
            IF NOT v_result.success THEN
              RAISE EXCEPTION 'FAILED A2: failed-analysis finalization failed: %', v_result.error_message;
            END IF;

            SELECT COUNT(*) INTO v_count
            FROM public.trade_analysis_usage
            WHERE user_id = v_user_id
              AND request_id = v_failed_request_id
              AND status = 'succeeded';
            IF v_count != 0 THEN
              RAISE EXCEPTION 'FAILED A3: failed analysis was recorded as succeeded';
            END IF;

            SELECT COUNT(*) INTO v_count
            FROM public.trade_analysis_usage
            WHERE user_id = v_user_id
              AND request_id = v_failed_request_id
              AND status = 'reserved'
              AND expires_at > now();
            IF v_count != 0 THEN
              RAISE EXCEPTION 'FAILED A4: failed analysis remains an active reservation';
            END IF;

            FOR i IN 2..4 LOOP
              v_request_id := gen_random_uuid();
              SELECT * INTO v_result
              FROM public.reserve_trade_quota(v_user_id, v_request_id, 'test-a-fp-' || i::TEXT);
              IF NOT v_result.success THEN
                RAISE EXCEPTION 'FAILED A%: slot after failed analysis should succeed: %', i + 3, v_result.error_message;
              END IF;
            END LOOP;

            SELECT COUNT(*) INTO v_reserved_count
            FROM public.trade_analysis_usage
            WHERE user_id = v_user_id
              AND status = 'reserved'
              AND expires_at > now();
            IF v_reserved_count != 3 THEN
              RAISE EXCEPTION 'FAILED A7: expected 3 active reservations after failed analysis, got %', v_reserved_count;
            END IF;

            v_request_id := gen_random_uuid();
            SELECT * INTO v_result
            FROM public.reserve_trade_quota(v_user_id, v_request_id, 'test-a-fp-5');
            IF v_result.success OR v_result.error_message != 'lifetime_limit_reached' THEN
              RAISE EXCEPTION 'FAILED A8: fourth active slot should be blocked after failed analysis; success=%, error=%',
                v_result.success, v_result.error_message;
            END IF;

            -- TEST B: Active reservations consume capacity
            v_user_id := v_user_ids[2];
            UPDATE public.users SET plan = 'free', is_pro = false WHERE id = v_user_id;
            FOR i IN 1..3 LOOP
              v_request_id := gen_random_uuid();
              SELECT * INTO v_result
              FROM public.reserve_trade_quota(v_user_id, v_request_id, 'test-b-fp-' || i::TEXT);
              IF NOT v_result.success THEN
                RAISE EXCEPTION 'FAILED B%: %', i, v_result.error_message;
              END IF;
            END LOOP;
            SELECT COUNT(*) INTO v_reserved_count
            FROM public.trade_analysis_usage
            WHERE user_id = v_user_id AND status = 'reserved' AND expires_at > now();
            IF v_reserved_count != 3 THEN
              RAISE EXCEPTION 'FAILED B4: expected 3 active reservations, got %', v_reserved_count;
            END IF;
            v_request_id := gen_random_uuid();
            SELECT * INTO v_result
            FROM public.reserve_trade_quota(v_user_id, v_request_id, 'test-b-fp-4');
            IF v_result.success OR v_result.error_message != 'lifetime_limit_reached' THEN
              RAISE EXCEPTION 'FAILED B5/B6: active reservations did not enforce capacity';
            END IF;

            -- TEST C: Expired reservations release capacity
            v_user_id := v_user_ids[3];
            UPDATE public.users SET plan = 'free', is_pro = false WHERE id = v_user_id;
            FOR i IN 1..3 LOOP
              v_request_id := gen_random_uuid();
              SELECT * INTO v_result
              FROM public.reserve_trade_quota(v_user_id, v_request_id, 'test-c-fp-res-' || i::TEXT);
              IF NOT v_result.success THEN
                RAISE EXCEPTION 'FAILED C%: %', i, v_result.error_message;
              END IF;
              IF i = 3 THEN
                v_req_id_c3_stored := v_request_id;
              END IF;
            END LOOP;
            SELECT COUNT(*) INTO v_reserved_count
            FROM public.trade_analysis_usage
            WHERE user_id = v_user_id AND status = 'reserved' AND expires_at > now();
            IF v_reserved_count != 3 THEN
              RAISE EXCEPTION 'FAILED C4: expected 3 active reservations, got %', v_reserved_count;
            END IF;
            UPDATE public.trade_analysis_usage
            SET expires_at = now() - INTERVAL '1 second'
            WHERE user_id = v_user_id AND request_id = v_req_id_c3_stored;
            v_request_id := gen_random_uuid();
            SELECT * INTO v_result
            FROM public.reserve_trade_quota(v_user_id, v_request_id, 'test-c-fp-new');
            IF NOT v_result.success THEN
              RAISE EXCEPTION 'FAILED C5: expired reservation did not release capacity: %', v_result.error_message;
            END IF;

            -- TEST D: Historical quota_date still counts (no daily reset)
            v_user_id := v_user_ids[4];
            UPDATE public.users SET plan = 'free', is_pro = false WHERE id = v_user_id;
            FOR i IN 1..3 LOOP
              v_request_id := gen_random_uuid();
              SELECT * INTO v_result
              FROM public.reserve_trade_quota(v_user_id, v_request_id, 'test-d-fp-' || i::TEXT);
              IF NOT v_result.success THEN
                RAISE EXCEPTION 'FAILED D%: %', i, v_result.error_message;
              END IF;
              SELECT * INTO v_result
              FROM public.finalize_trade_quota(v_user_id, v_request_id, true, NULL);
              IF NOT v_result.success THEN
                RAISE EXCEPTION 'FAILED D% finalize: %', i, v_result.error_message;
              END IF;
              IF i = 1 THEN
                v_req_id_c3_stored := v_request_id;
              END IF;
            END LOOP;
            UPDATE public.trade_analysis_usage
            SET quota_date = (now() AT TIME ZONE 'UTC')::date - 30
            WHERE user_id = v_user_id AND request_id = v_req_id_c3_stored;
            v_request_id := gen_random_uuid();
            SELECT * INTO v_result
            FROM public.reserve_trade_quota(v_user_id, v_request_id, 'test-d-fp-4');
            IF v_result.success OR v_result.error_message != 'lifetime_limit_reached' THEN
              RAISE EXCEPTION 'FAILED D5/D6: historical usage did not enforce lifetime limit';
            END IF;
            SELECT * INTO v_result FROM public.get_trade_quota_status(v_user_id);
            IF v_result.used_count != 3 OR v_result.remaining_count != 0 THEN
              RAISE EXCEPTION 'FAILED D7: expected used=3 remaining=0, got used=% remaining=%',
                v_result.used_count, v_result.remaining_count;
            END IF;

            -- TEST E: Free quota capacity enforcement
            v_user_id := v_user_ids[5];
            UPDATE public.users SET plan = 'free', is_pro = false WHERE id = v_user_id;
            FOR i IN 1..3 LOOP
              v_request_id := gen_random_uuid();
              SELECT * INTO v_result
              FROM public.reserve_trade_quota(v_user_id, v_request_id, 'test-e-fp-' || i::TEXT);
              IF NOT v_result.success THEN
                RAISE EXCEPTION 'FAILED E%: %', i, v_result.error_message;
              END IF;
            END LOOP;
            v_request_id := gen_random_uuid();
            SELECT * INTO v_result
            FROM public.reserve_trade_quota(v_user_id, v_request_id, 'test-e-fp-4');
            IF v_result.success OR v_result.error_message != 'lifetime_limit_reached' THEN
              RAISE EXCEPTION 'FAILED E4/E5: free capacity limit not enforced';
            END IF;

            -- TEST F: Idempotency
            v_user_id := v_user_ids[6];
            UPDATE public.users SET plan = 'free', is_pro = false WHERE id = v_user_id;
            v_request_id := gen_random_uuid();
            SELECT * INTO v_result
            FROM public.reserve_trade_quota(v_user_id, v_request_id, 'test-f-fp');
            IF NOT v_result.success THEN
              RAISE EXCEPTION 'FAILED F1: %', v_result.error_message;
            END IF;
            SELECT * INTO v_result
            FROM public.reserve_trade_quota(v_user_id, v_request_id, 'test-f-fp');
            IF v_result.error_message != 'duplicate_request_id' THEN
              RAISE EXCEPTION 'FAILED F2: expected duplicate_request_id, got %', v_result.error_message;
            END IF;
            SELECT COUNT(*) INTO v_count
            FROM public.trade_analysis_usage
            WHERE user_id = v_user_id AND request_id = v_request_id;
            IF v_count != 1 THEN
              RAISE EXCEPTION 'FAILED F3: expected exactly 1 logical usage row, got %', v_count;
            END IF;

            -- TEST G: Pro plan bypasses the Free lifetime cap
            v_user_id := v_user_ids[7];
            DELETE FROM public.trade_analysis_usage WHERE user_id = v_user_id;
            UPDATE public.users SET plan = 'free', is_pro = false WHERE id = v_user_id;
            FOR i IN 1..3 LOOP
              INSERT INTO public.trade_analysis_usage
                (user_id, quota_date, request_id, request_fingerprint, status, created_at, expires_at, completed_at)
              VALUES
                (v_user_id, (now() AT TIME ZONE 'UTC')::date, gen_random_uuid(),
                 'test-g-history-' || i::TEXT, 'succeeded', now(), now() + INTERVAL '1 hour', now());
            END LOOP;
            UPDATE public.users SET plan = 'pro', is_pro = true WHERE id = v_user_id;
            v_request_id := gen_random_uuid();
            SELECT * INTO v_result
            FROM public.reserve_trade_quota(v_user_id, v_request_id, 'test-g-pro-bypass');
            IF NOT v_result.success THEN
              RAISE EXCEPTION 'FAILED G: Pro user did not bypass quota: %', v_result.error_message;
            END IF;

            -- TEST H: Elite plan bypasses the Free lifetime cap
            v_user_id := v_user_ids[8];
            DELETE FROM public.trade_analysis_usage WHERE user_id = v_user_id;
            UPDATE public.users SET plan = 'free', is_pro = false WHERE id = v_user_id;
            FOR i IN 1..3 LOOP
              INSERT INTO public.trade_analysis_usage
                (user_id, quota_date, request_id, request_fingerprint, status, created_at, expires_at, completed_at)
              VALUES
                (v_user_id, (now() AT TIME ZONE 'UTC')::date, gen_random_uuid(),
                 'test-h-history-' || i::TEXT, 'succeeded', now(), now() + INTERVAL '1 hour', now());
            END LOOP;
            UPDATE public.users SET plan = 'elite', is_pro = true WHERE id = v_user_id;
            v_request_id := gen_random_uuid();
            SELECT * INTO v_result
            FROM public.reserve_trade_quota(v_user_id, v_request_id, 'test-h-elite-bypass');
            IF NOT v_result.success THEN
              RAISE EXCEPTION 'FAILED H: Elite user did not bypass quota: %', v_result.error_message;
            END IF;
          END $$;
          BEHAVIOR006
          echo "OK: Migration 006 behavioral tests A-H verified"

      - name: Verify Migration 006 - Concurrency test (true concurrent transactions)
        env:
          SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
        run: |
          echo "=== VERIFYING MIGRATION 006: CONCURRENCY TEST ==="
          TEST_USER=$(psql -X -t "$SUPABASE_TEST_DB_URL" -c "SELECT id FROM public.users ORDER BY id OFFSET 6 LIMIT 1;" | xargs)
          if [ -z "$TEST_USER" ]; then echo "ERROR: FAILED: No test user"; exit 1; fi
          psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" << SETUP
          DELETE FROM public.trade_analysis_usage WHERE user_id = '$TEST_USER'::uuid;
          UPDATE public.users SET plan = 'free', is_pro = false WHERE id = '$TEST_USER'::uuid;
          INSERT INTO public.trade_analysis_usage (user_id, quota_date, request_id, request_fingerprint, status, created_at, expires_at, completed_at) VALUES ('$TEST_USER'::uuid, now()::date, gen_random_uuid(), 'fp1', 'succeeded', now(), now() + INTERVAL '1 hour', now());
          INSERT INTO public.trade_analysis_usage (user_id, quota_date, request_id, request_fingerprint, status, created_at, expires_at, completed_at) VALUES ('$TEST_USER'::uuid, now()::date, gen_random_uuid(), 'fp2', 'succeeded', now(), now() + INTERVAL '1 hour', now());
          SETUP
          REQ_ID_1=$(psql -X -t "$SUPABASE_TEST_DB_URL" -c "SELECT gen_random_uuid();" | xargs)
          REQ_ID_2=$(psql -X -t "$SUPABASE_TEST_DB_URL" -c "SELECT gen_random_uuid();" | xargs)
          timeout 5s psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" << S1 > /tmp/s1.txt 2>&1 &
          BEGIN;
          SELECT * FROM public.reserve_trade_quota('$TEST_USER'::uuid, '$REQ_ID_1'::uuid, 'c1');
          SELECT pg_sleep(2);
          COMMIT;
          S1
          S1PID=$!
          sleep 0.2
          timeout 5s psql -X -v ON_ERROR_STOP=1 "$SUPABASE_TEST_DB_URL" << S2 > /tmp/s2.txt 2>&1 &
          SELECT * FROM public.reserve_trade_quota('$TEST_USER'::uuid, '$REQ_ID_2'::uuid, 'c2');
          S2
          S2PID=$!
          wait $S1PID; R1=$?; wait $S2PID; R2=$?
          if [ $R1 -ne 0 ] || [ $R2 -ne 0 ]; then echo "ERROR: FAILED: Concurrent session failed (R1=$R1, R2=$R2)"; exit 1; fi
          V_SUCC=$(psql -X -v ON_ERROR_STOP=1 -At \
            -v test_user="$TEST_USER" \
            "$SUPABASE_TEST_DB_URL" <<'SQL'
          SELECT COUNT(*)
          FROM public.trade_analysis_usage
          WHERE user_id = :'test_user'::uuid
            AND status = 'succeeded';
          SQL
          )
          V_ACTV=$(psql -X -v ON_ERROR_STOP=1 -At \
            -v test_user="$TEST_USER" \
            -v req1="$REQ_ID_1" \
            -v req2="$REQ_ID_2" \
            "$SUPABASE_TEST_DB_URL" <<'SQL'
          SELECT COUNT(*)
          FROM public.trade_analysis_usage
          WHERE user_id = :'test_user'::uuid
            AND request_id IN (:'req1'::uuid, :'req2'::uuid)
            AND status = 'reserved'
            AND expires_at > now();
          SQL
          )
          V_TOTAL=$(psql -X -v ON_ERROR_STOP=1 -At \
            -v test_user="$TEST_USER" \
            "$SUPABASE_TEST_DB_URL" <<'SQL'
          SELECT COUNT(*)
          FROM public.trade_analysis_usage
          WHERE user_id = :'test_user'::uuid
            AND (
              status = 'succeeded'
              OR (status = 'reserved' AND expires_at > now())
            );
          SQL
          )
          if [ "$V_SUCC" != "2" ]; then echo "ERROR: FAILED: Expected 2 succeeded, got $V_SUCC"; exit 1; fi
          if [ "$V_ACTV" != "1" ]; then echo "ERROR: FAILED: Expected 1 active, got $V_ACTV"; exit 1; fi
          if [ "$V_TOTAL" != "3" ]; then echo "ERROR: FAILED: Expected 3 total, got $V_TOTAL"; exit 1; fi
          echo "OK: Migration 006 concurrency test verified"
