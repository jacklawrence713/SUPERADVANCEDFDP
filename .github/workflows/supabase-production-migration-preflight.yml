name: Supabase Production Migration History and Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rehearsed migration candidate
        uses: actions/checkout@v4
        with:
          ref: 06503e90262fd43d2cca33ee1dbf46b22a404985

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify canonical migration set
        shell: bash
        run: |
          set -euo pipefail

          expected="$(cat <<'EOF'
20260428000000_create_users_table.sql
20260904133837_add_abuse_prevention.sql
20260921144441_odds_cache.sql
20260922003719_fdp_value_snapshots.sql
20260924152532_entitlement_security.sql
20260924234147_trade_analysis_quota.sql
20260925213441_billing_event_ledger.sql
EOF
)"

          actual="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)"

          echo "Expected migrations:"
          printf '%s\n' "$expected"
          echo ""
          echo "Actual migrations:"
          printf '%s\n' "$actual"

          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")

          echo "OK: canonical seven-migration set verified"

      - name: Show production migration history before repair
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase migration list --db-url "$DB_URL"

      - name: Mark M001 and M002 as already applied
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase migration repair 20260428000000 --status applied --db-url "$DB_URL"
          supabase migration repair 20260904133837 --status applied --db-url "$DB_URL"

      - name: Show production migration history after repair
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase migration list --db-url "$DB_URL"

      - name: Production database push dry run
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "DRY RUN ONLY - NO PRODUCTION SCHEMA CHANGES"
          supabase db push --dry-run --db-url "$DB_URL"