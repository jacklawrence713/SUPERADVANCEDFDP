name: Supabase Manual Backup

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create backup folder
        run: mkdir -p supabase-backup

      - name: Backup roles
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f supabase-backup/roles.sql --role-only

      - name: Backup schema
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f supabase-backup/schema.sql

      - name: Backup data
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f supabase-backup/data.sql --use-copy --data-only

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-backup
          path: supabase-backup/
          retention-days: 30
