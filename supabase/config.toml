[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://fantasydraftpros.com"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false

# ── Edge Function Auth & CORS Decisions ───────────────────────────
#
# verify_jwt = Supabase gateway-level JWT check (before function runs).
#
# analyze-trade:   verify_jwt=false — manual Bearer → getUser for JSON 401.
#                  CORS: origin-checked (fantasydraftpros.com + localhost dev).
#
# cancel-subscription: verify_jwt=false — manual Bearer → getUser.
#                  CORS: origin-checked.
#
# create-checkout: verify_jwt=false — manual Bearer → getUser.
#                  CORS: origin-checked.
#
# stripe-webhook:  verify_jwt=false — MUST be false. Stripe sends raw
#                  POST with stripe-signature, NOT a Supabase JWT.
#                  Auth via Stripe webhook signature verification.
#                  CORS: none (server-to-server, no browser requests).
#
# send-email:      verify_jwt=false — welcome emails sent before session
#                  exists. Other types do manual auth. welcome_pro
#                  validates userId ownership server-side.
#                  CORS: origin-checked.
#
[functions.analyze-trade]
verify_jwt = false

[functions.cancel-subscription]
verify_jwt = false

[functions.create-checkout]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.send-email]
verify_jwt = false

# fetch-odds:     verify_jwt=false — public endpoint for odds data.
#                 No user auth required (odds are shown to all users).
#                 Provider API key stored server-side only (THE_ODDS_API_KEY).
#                 CORS: origin-checked.
[functions.fetch-odds]
verify_jwt = false
