[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://fantasydraftpros.com"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false

# ── Edge Function Auth & CORS Decisions ───────────────────────────
#
# verify_jwt = Supabase gateway-level JWT check (before function runs).
#
# analyze-trade:   verify_jwt=true — Gateway validates user JWT before handler.
#                  Handler retains auth.getUser() + quota checks (defense-in-depth).
#                  Browser always supplies authenticated user JWT.
#                  CORS: origin-checked (fantasydraftpros.com + localhost dev).
#
# cancel-subscription: verify_jwt=true — Gateway validates user JWT.
#                  Handler retains ownership checks + Stripe validation.
#                  Browser always supplies authenticated user JWT.
#                  CORS: origin-checked.
#
# create-checkout: verify_jwt=true — Gateway validates user JWT.
#                  Handler retains user/customer/plan validation.
#                  Browser always supplies authenticated user JWT.
#                  CORS: origin-checked.
#
# stripe-webhook:  verify_jwt=false — MUST be false. Stripe sends raw
#                  POST with stripe-signature, NOT a Supabase JWT.
#                  Auth via Stripe webhook signature verification.
#                  CORS: none (server-to-server, no browser requests).
#
# send-email:      verify_jwt=true — ALL email types now require authentication
#                  (Prompt 35 hardening). Removed unauthenticated "welcome" path
#                  that allowed open email relay. Handler retains ownership/
#                  authorization checks. Browser always supplies authenticated JWT.
#                  CORS: origin-checked.
#
[functions.analyze-trade]
verify_jwt = true

[functions.cancel-subscription]
verify_jwt = true

[functions.create-checkout]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.send-email]
verify_jwt = true

# fetch-odds:     verify_jwt=true — Gateway validates user JWT before handler.
#                 Handler retains manual plan check (Pro/Elite only).
#                 THE_ODDS_API_KEY stored server-side only.
#                 Browser always supplies authenticated user JWT.
#                 CORS: origin-checked.
[functions.fetch-odds]
verify_jwt = true

# record-value-snapshots: verify_jwt=false — service-to-service snapshot ingestion.
#                 Uses FDP_SNAPSHOT_WRITE_SECRET (custom secret, not JWT).
#                 Called by scripts/generate-snapshots.ts for value updates.
#                 CORS: none (server-to-server).
[functions.record-value-snapshots]
verify_jwt = false

# trade-quota-status: verify_jwt=true — Gateway validates user JWT.
#                 Handler retains manual JWT validation + per-user quota lookup.
#                 Returns authenticated user's trade quota status.
#                 Browser always supplies authenticated user JWT.
#                 CORS: origin-checked.
[functions.trade-quota-status]
verify_jwt = true
